[project]
name = "clauseproof"
version = "0.1.0"
description = "合同条款审阅 Agent：引用可溯源、不确定性可量化"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.27", "typer>=0.12", "rich>=13.7", "tqdm>=4.66"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clauseproof"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".uv-python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"